name: Build Reader

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install VS2019 Build Tools base
        shell: powershell
        run: |
          choco install visualstudio2019buildtools --yes --no-progress

      - name: Add VS2019 VCTools workload (v142)
        shell: powershell
        run: |
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify `
            --installPath "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools" `
            --add Microsoft.VisualStudio.Workload.VCTools `
            --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 `
            --add Microsoft.VisualStudio.Component.Windows10SDK.17763 `
            --quiet --wait --norestart
          exit $LASTEXITCODE

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[16.0,17.0)'

      - name: Build (Release x86)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\VC\Auxiliary\Build\vcvars32.bat"
          msbuild Reader.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v142

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reader-x86-Release
          path: Release/Reader.exe

      - name: Build (Release x64)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          msbuild Reader.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reader-x64-Release
          path: x64/Release/Reader.exe
